name: Build Windows Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Locate openslide_bin
        id: openslide
        run: |
          python -c "import openslide_bin, os; print(os.path.dirname(openslide_bin.__file__))" > openslide_path.txt
          echo "path=$(type openslide_path.txt)" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name TiffCropper ^
            --add-data "${{ steps.openslide.outputs.path }};openslide_bin" ^
            src\tiffcropper\app.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TiffCropper.exe