name: Build TiffCropper

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # System dependencies
      # -----------------------------
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenslide0 openslide-tools \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-randr0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-sync1 \
            libxcb-glx0 \
            libgl1

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openslide

      # -----------------------------
      # Python dependencies
      # -----------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Build
      # -----------------------------
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm .\TiffCropper.spec

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --noconfirm \
            --onedir \
            --console \
            --noupx \
            --name TiffCropper \
            src/tiffcropper/app.py

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm \
            --onedir \
            --windowed \
            --noupx \
            --name TiffCropper \
            src/tiffcropper/app.py

      # -----------------------------
      # Packaging
      # -----------------------------
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Listing dist contents:"
          Get-ChildItem -Recurse dist

          if (Test-Path "dist\TiffCropper.exe") {
            New-Item -ItemType Directory -Path "TiffCropper-Windows" -Force
            Copy-Item "dist\TiffCropper.exe" "TiffCropper-Windows\TiffCropper.exe"
            Compress-Archive -Path "TiffCropper-Windows\*" -DestinationPath "TiffCropper-Windows.zip" -Force
          }
          else {
            Write-Host "Could not find dist\TiffCropper.exe."
            Get-ChildItem -Recurse dist
            exit 1
          }

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          echo "Listing dist contents:"
          find dist -maxdepth 3 -type f -o -type d

          if [ -d "dist/TiffCropper" ]; then
            cd dist
            tar -czf ../TiffCropper-Linux.tar.gz TiffCropper
          else
            echo "Could not find dist/TiffCropper."
            find dist -maxdepth 3 -type f -o -type d
            exit 1
          fi

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          echo "Listing dist contents:"
          find dist -maxdepth 3 -type f -o -type d

          if [ -d "dist/TiffCropper.app" ]; then
            cd dist
            zip -r ../TiffCropper-macOS.zip TiffCropper.app
          elif [ -d "dist/TiffCropper" ]; then
            cd dist
            zip -r ../TiffCropper-macOS.zip TiffCropper
          else
            echo "Could not find expected macOS output."
            find dist -maxdepth 3 -type f -o -type d
            exit 1
          fi

      # -----------------------------
      # Upload Actions artifacts
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiffCropper-${{ runner.os }}
          path: |
            TiffCropper-*.zip
            TiffCropper-*.tar.gz