name: Build TiffCropper

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openslide-tools libopenslide0

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openslide

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --noconfirm TiffCropper.spec

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --noconfirm --name TiffCropper --windowed src/tiffcropper/app.py

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm --name TiffCropper --windowed src/tiffcropper/app.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TiffCropper.exe -DestinationPath TiffCropper-Windows.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../TiffCropper-Linux.zip TiffCropper

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../TiffCropper-macOS.zip TiffCropper.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiffCropper-${{ runner.os }}
          path: |
            TiffCropper-*.zip